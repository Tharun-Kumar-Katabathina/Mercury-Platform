# Keeps dependencies, base images and the pipeline's own actions current; each update arrives as a pull request
# that has to pass the full pipeline before it can merge.
# Version updates paused on 2026-10-19 at the owner's request: open-pull-requests-limit: 0 stops new update PRs.
# To resume, remove "open-pull-requests-limit: 0" from each entry (the default limit is 5).
version: 2
updates:
  - { package-ecosystem: maven, directory: /services/product-service, schedule: { interval: weekly }, open-pull-requests-limit: 0 }
  - { package-ecosystem: maven, directory: /services/inventory-service, schedule: { interval: weekly }, open-pull-requests-limit: 0 }
  - { package-ecosystem: maven, directory: /services/order-service, schedule: { interval: weekly }, open-pull-requests-limit: 0 }
  - { package-ecosystem: maven, directory: /services/notification-service, schedule: { interval: weekly }, open-pull-requests-limit: 0 }
  - { package-ecosystem: maven, directory: /services/user-service, schedule: { interval: weekly }, open-pull-requests-limit: 0 }
  - { package-ecosystem: maven, directory: /services/recommendation-service, schedule: { interval: weekly }, open-pull-requests-limit: 0 }
  - { package-ecosystem: maven, directory: /services/api-gateway, schedule: { interval: weekly }, open-pull-requests-limit: 0 }
  - { package-ecosystem: docker, directory: /infrastructure/docker, schedule: { interval: weekly }, open-pull-requests-limit: 0 }
  - { package-ecosystem: github-actions, directory: /, schedule: { interval: weekly }, open-pull-requests-limit: 0 }
