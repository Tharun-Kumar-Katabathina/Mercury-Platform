# Load balancer in front of the (possibly scaled) services. Docker's embedded DNS returns every replica of a
# service, and nginx re-resolves it every few seconds, so `docker compose up --scale order-service=3` just works.
worker_processes auto;
worker_rlimit_nofile 65535;
events { worker_connections 16384; }

http {
  access_log off;
  resolver 127.0.0.11 valid=5s ipv6=off;
  keepalive_timeout 65;
  upstream_keepalive_timeout 60s;

  # variables force nginx to re-resolve at request time instead of once at start-up
  server {
    listen 8080;

    location ~ ^/api/v1/products {
      set $product product-service;
      proxy_pass http://$product:8081;
      proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ~ ^/api/v1/inventory {
      set $inventory inventory-service;
      proxy_pass http://$inventory:8082;
      proxy_http_version 1.1; proxy_set_header Connection "";
    }
    location ~ ^/api/v1/orders {
      set $order order-service;
      proxy_pass http://$order:8083;
      proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ~ ^/api/v1/notifications {
      set $notification notification-service;
      proxy_pass http://$notification:8084;
      proxy_http_version 1.1; proxy_set_header Connection "";
    }
    location ~ ^/api/v1/(recommendations|interactions) {
      set $recommendation recommendation-service;
      proxy_pass http://$recommendation:8086;
      proxy_http_version 1.1; proxy_set_header Connection "";
    }
    location = /healthz { return 200 "ok\n"; }
  }
}
