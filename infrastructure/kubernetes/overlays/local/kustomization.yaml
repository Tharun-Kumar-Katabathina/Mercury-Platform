# kind / minikube / Docker Desktop: one replica, images from the local Docker daemon, small volumes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - { name: mercury/product-service,      newTag: dev }
  - { name: mercury/inventory-service,    newTag: dev }
  - { name: mercury/order-service,        newTag: dev }
  - { name: mercury/notification-service, newTag: dev }
  - { name: mercury/user-service,         newTag: dev }
  - { name: mercury/api-gateway,          newTag: dev }
  - { name: mercury/recommendation-service, newTag: dev }
patches:
  - target: { kind: Deployment, labelSelector: "mercury/tier=app" }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      - { op: replace, path: /spec/minReplicas, value: 1 }
      - { op: replace, path: /spec/maxReplicas, value: 3 }
  - target: { kind: PodDisruptionBudget }
    patch: |-
      - { op: replace, path: /spec/minAvailable, value: 0 }
