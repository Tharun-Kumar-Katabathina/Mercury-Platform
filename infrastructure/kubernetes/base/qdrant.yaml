# Vector database for the recommendation service.
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  labels: { app.kubernetes.io/name: qdrant, app.kubernetes.io/part-of: mercury, mercury/tier: data }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: qdrant }
  ports:
    - { name: http, port: 6333 }
    - { name: grpc, port: 6334 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  labels: { app.kubernetes.io/name: qdrant, app.kubernetes.io/part-of: mercury, mercury/tier: data }
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: qdrant }
  template:
    metadata:
      labels: { app.kubernetes.io/name: qdrant, app.kubernetes.io/part-of: mercury, mercury/tier: data }
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.19.1
          ports:
            - { name: http, containerPort: 6333 }
            - { name: grpc, containerPort: 6334 }
          env:
            # Qdrant writes this marker after start-up (used only by its optional OOM recovery mode, which is off): the working
            # directory is read-only, so it goes to the scratch volume
            - { name: QDRANT_INIT_FILE_PATH, value: /tmp/.qdrant-initialized }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits:   { cpu: "1", memory: 512Mi }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          # collections live on the volume; snapshots taken through the API are scratch (the index is rebuilt from order events)
          volumeMounts:
            - { name: storage, mountPath: /qdrant/storage }
            - { name: snapshots, mountPath: /qdrant/snapshots }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: snapshots
          emptyDir: { sizeLimit: 256Mi }
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
  volumeClaimTemplates:
    - metadata: { name: storage }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
