apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mercury

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - kafka.yaml
  - qdrant.yaml
  - redis.yaml
  - product-service.yaml
  - inventory-service.yaml
  - order-service.yaml
  - notification-service.yaml
  - user-service.yaml
  - recommendation-service.yaml
  - api-gateway.yaml
  - networkpolicy.yaml

# Credentials are never committed. Create secrets.env from secrets.env.example, or run
# scripts/k8s-create-secrets.sh, which writes random values. A missing file fails the build on purpose.
secretGenerator:
  - name: mercury-secrets
    envs:
      - secrets.env
  # the RS256 key pair (user-service signs, everyone else verifies): copied next to this file (git-ignored) by scripts/k8s-create-secrets.sh
  - name: mercury-jwt-keys
    files:
      - jwt-private.pem
      - jwt-public.pem
generatorOptions:
  disableNameSuffixHash: true
