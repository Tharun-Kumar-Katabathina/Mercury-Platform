# Default deny for everything in the namespace, then open exactly the paths the platform uses.
# (Enforced only by a CNI that implements NetworkPolicy, e.g. Calico or Cilium.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# the data tier accepts connections only from the application pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-tier-from-apps
spec:
  podSelector:
    matchLabels: { mercury/tier: data }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { mercury/tier: app }
      ports:
        - { port: 5432 }
        - { port: 9092 }
        - { port: 6333 }
        - { port: 6334 }
        - { port: 6379 }
    - from:
        - podSelector:
            matchLabels: { mercury/tier: data }     # Kafka's controller talks to itself
      ports:
        - { port: 9092 }
        - { port: 9093 }
---
# services call each other (Product -> Inventory, Order -> Product/Inventory); ingress/monitoring reach the HTTP ports
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apps-ingress
spec:
  podSelector:
    matchLabels: { mercury/tier: app }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { mercury/tier: app }
      ports:
        - { port: 8081 }
        - { port: 8082 }
        - { port: 8083 }
        - { port: 8084 }
        - { port: 8085 }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { port: 8081 }
        - { port: 8082 }
        - { port: 8083 }
        - { port: 8084 }
---
# the gateway is the one pod that accepts traffic from outside the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-anywhere
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: api-gateway }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 8090 }
