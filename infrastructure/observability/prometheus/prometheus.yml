global:
  scrape_interval: 5s          # short on purpose: dashboards react within seconds in demos and load tests
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # DNS service discovery: every replica of a service is scraped, so `--scale order-service=3` just works
  - job_name: mercury-services
    metrics_path: /actuator/prometheus
    metric_relabel_configs:
      # The Prometheus client reserves the `_created` suffix, so the counter `orders.created` is exposed as
      # `orders_total`. Restore the documented name so queries and dashboards read naturally.
      - source_labels: [__name__]
        regex: orders_total
        target_label: __name__
        replacement: orders_created_total
    dns_sd_configs:
      - { names: [product-service], type: A, port: 8081, refresh_interval: 5s }
      - { names: [inventory-service], type: A, port: 8082, refresh_interval: 5s }
      - { names: [order-service], type: A, port: 8083, refresh_interval: 5s }
      - { names: [notification-service], type: A, port: 8084, refresh_interval: 5s }
      - { names: [user-service], type: A, port: 8085, refresh_interval: 5s }
      - { names: [recommendation-service], type: A, port: 8086, refresh_interval: 5s }
      - { names: [api-gateway], type: A, port: 8090, refresh_interval: 5s }
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
