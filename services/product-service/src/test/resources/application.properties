spring.datasource.url=jdbc:h2:mem:product;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

inventory.service.url=http://localhost:8082

# tracing spans are created (so log correlation works) but nothing is exported in tests
management.tracing.export.enabled=false
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false

# the business-logic tests run without authentication; SecurityApiTests switch it on
mercury.security.enabled=false

management.endpoints.web.exposure.include=health,metrics,prometheus

# same short Redis timeouts as production, so a Redis outage costs milliseconds, not the 60 s default
spring.data.redis.timeout=300ms
spring.data.redis.connect-timeout=300ms
