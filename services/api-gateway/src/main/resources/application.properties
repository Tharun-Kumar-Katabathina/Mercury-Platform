spring.application.name=api-gateway
server.port=${SERVER_PORT:8090}

# ---- routes: only the public API. Inventory has no route; the service-token endpoint is denied at the edge. ----------
spring.cloud.gateway.server.webmvc.routes[0].id=identity
spring.cloud.gateway.server.webmvc.routes[0].uri=${USER_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/users/**,/.well-known/**
spring.cloud.gateway.server.webmvc.routes[1].id=catalogue
spring.cloud.gateway.server.webmvc.routes[1].uri=${PRODUCT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/products/**
spring.cloud.gateway.server.webmvc.routes[2].id=orders
spring.cloud.gateway.server.webmvc.routes[2].uri=${ORDER_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/orders/**
spring.cloud.gateway.server.webmvc.routes[3].id=notifications
spring.cloud.gateway.server.webmvc.routes[3].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/notifications/**
spring.cloud.gateway.server.webmvc.routes[4].id=recommendations
spring.cloud.gateway.server.webmvc.routes[4].uri=${RECOMMENDATION_SERVICE_URL:http://localhost:8086}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v1/recommendations/**,/api/v1/interactions/**

# ---- edge policies -------------------------------------------------------------------------------------------------
gateway.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
gateway.rate-limit.ip-per-second=${RATE_LIMIT_IP_PER_SECOND:100}
gateway.rate-limit.ip-burst=${RATE_LIMIT_IP_BURST:200}
gateway.rate-limit.user-per-second=${RATE_LIMIT_USER_PER_SECOND:30}
gateway.rate-limit.user-burst=${RATE_LIMIT_USER_BURST:60}
gateway.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:20}
gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
gateway.max-body-size=${MAX_BODY_SIZE:1MB}

mercury.security.enabled=${SECURITY_ENABLED:true}
mercury.security.jwt.public-key-file=${JWT_PUBLIC_KEY_FILE:}
mercury.security.jwt.issuer=${JWT_ISSUER:mercury-user-service}
mercury.security.jwt.audience=${JWT_AUDIENCE:mercury}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.max-http-request-header-size=16KB

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,metrics,prometheus}
# ---- container / Kubernetes runtime (Phase 11) ------------------------------------------------
# On SIGTERM: stop taking new requests, let in-flight ones finish (bounded), then close pools and consumers.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:25s}
# /actuator/health/liveness (is the process alive) and /actuator/health/readiness (should it get traffic).
# Readiness depends on the database only: a Kafka outage must not take a service out of rotation,
# because the outbox and the REST API keep working without it.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.show-details=never
# ---- observability (Phase 12) -----------------------------------------------------------------
# Metrics: scraped by Prometheus at /actuator/prometheus. Every series carries the application name.
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s
# Traces: always created (their ids appear in every log line); exported over OTLP only when enabled and
# pointed at a collector. REST calls and Kafka messages carry the W3C traceparent header between services.
management.tracing.export.enabled=${TRACING_EXPORT_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
# metrics are pulled by Prometheus and logs go to stdout: no OTLP export for either
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
