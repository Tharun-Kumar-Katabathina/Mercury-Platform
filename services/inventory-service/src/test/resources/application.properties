spring.datasource.url=jdbc:h2:mem:inventory;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
# mirror main: this file replaces the main application.properties during tests
spring.jpa.open-in-view=false

# unit tests have no broker: no listener, no publisher, no topic creation. The Kafka tests override these.
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
inventory.command-topic=mercury.inventory.commands
inventory.command-dlq-topic=mercury.inventory.commands.dlq
inventory.topic-partitions=3
inventory.retry.max-attempts=3
inventory.retry.initial-interval=100ms
inventory.retry.multiplier=2.0
inventory.retry.max-interval=500ms
inventory.outbox.enabled=false
inventory.outbox.topic=mercury.inventory.events
management.endpoints.web.exposure.include=health,metrics,outbox

# tracing spans are created (so log correlation works) but nothing is exported in tests
management.tracing.export.enabled=false
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false

# the business-logic tests run without authentication; SecurityApiTests switch it on
mercury.security.enabled=false
