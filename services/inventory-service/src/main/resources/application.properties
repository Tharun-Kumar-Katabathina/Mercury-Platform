spring.application.name=inventory-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/mercury_inventory}
spring.datasource.username=${POSTGRES_USER:mercury}
spring.datasource.password=${POSTGRES_PASSWORD:change-me}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- asynchronous order reservation over Kafka (Phase 10) -------------------------------------
# The service starts and serves its REST API with Kafka down. Commands wait in Kafka, replies wait
# in the outbox, and both are processed once the broker is back.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${INVENTORY_CONSUMER_GROUP:inventory-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# the offset is committed only after the command was processed
spring.kafka.listener.ack-mode=record
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=${KAFKA_PRODUCER_MAX_BLOCK_MS:5000}
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:5000}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:10000}

inventory.command-topic=${INVENTORY_COMMAND_TOPIC:mercury.inventory.commands}
inventory.command-dlq-topic=${INVENTORY_COMMAND_DLQ_TOPIC:mercury.inventory.commands.dlq}
inventory.topic-partitions=${INVENTORY_TOPIC_PARTITIONS:3}
# bounded in-consumer retries with backoff, then the command goes to the dead-letter topic
inventory.retry.max-attempts=${INVENTORY_RETRY_MAX_ATTEMPTS:4}
inventory.retry.initial-interval=${INVENTORY_RETRY_INITIAL_INTERVAL:500ms}
inventory.retry.multiplier=${INVENTORY_RETRY_MULTIPLIER:2.0}
inventory.retry.max-interval=${INVENTORY_RETRY_MAX_INTERVAL:5s}

inventory.outbox.enabled=${INVENTORY_OUTBOX_ENABLED:true}
inventory.outbox.topic=${INVENTORY_OUTBOX_TOPIC:mercury.inventory.events}
inventory.outbox.interval=${INVENTORY_OUTBOX_INTERVAL:1s}
inventory.outbox.batch-size=${INVENTORY_OUTBOX_BATCH_SIZE:50}
inventory.outbox.lease=${INVENTORY_OUTBOX_LEASE:30s}
inventory.outbox.initial-backoff=${INVENTORY_OUTBOX_INITIAL_BACKOFF:1s}
inventory.outbox.max-backoff=${INVENTORY_OUTBOX_MAX_BACKOFF:1m}
inventory.outbox.backoff-multiplier=${INVENTORY_OUTBOX_BACKOFF_MULTIPLIER:2.0}
inventory.outbox.send-timeout=${INVENTORY_OUTBOX_SEND_TIMEOUT:10s}

# read-only operational view of the outbox (event ids, types and order ids; never payloads)
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,metrics,prometheus,outbox}

# ---- container / Kubernetes runtime (Phase 11) ------------------------------------------------
# On SIGTERM: stop taking new requests, let in-flight ones finish (bounded), then close pools and consumers.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:25s}
# /actuator/health/liveness (is the process alive) and /actuator/health/readiness (should it get traffic).
# Readiness depends on the database only: a Kafka outage must not take a service out of rotation,
# because the outbox and the REST API keep working without it.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never

# ---- observability (Phase 12) -----------------------------------------------------------------
# Metrics: scraped by Prometheus at /actuator/prometheus. Every series carries the application name.
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s
# Traces: always created (their ids appear in every log line); exported over OTLP only when enabled and
# pointed at a collector. REST calls and Kafka messages carry the W3C traceparent header between services.
management.tracing.export.enabled=${TRACING_EXPORT_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
# metrics are pulled by Prometheus and logs go to stdout: no OTLP export for either
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
# observe Kafka producing and consuming: one span per send/receive, linked through message headers
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
# Tomcat thread and session gauges (tomcat.threads.busy ...) for the infrastructure dashboard
server.tomcat.mbeanregistry.enabled=true
