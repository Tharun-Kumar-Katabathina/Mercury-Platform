spring.application.name=order-service
server.port=${SERVER_PORT:8083}

spring.datasource.url=${ORDER_DB_URL:jdbc:postgresql://localhost:5432/mercury_order}
spring.datasource.username=${POSTGRES_USER:mercury}
spring.datasource.password=${POSTGRES_PASSWORD:change-me}

# schema is owned by Flyway; Hibernate only verifies it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# downstream services (never their databases)
product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8081}
inventory.service.url=${INVENTORY_SERVICE_URL:http://localhost:8082}

# Timeouts for every call to Product and Inventory. Without them a hung downstream would hang the
# order request (and hold its idempotency key) indefinitely. No retries: see docs/order-service.md.
spring.http.clients.connect-timeout=${HTTP_CLIENT_CONNECT_TIMEOUT:2s}
spring.http.clients.read-timeout=${HTTP_CLIENT_READ_TIMEOUT:5s}

# how long a duplicate request waits for the first request with the same Idempotency-Key to finish
order.idempotency.wait-timeout=${ORDER_IDEMPOTENCY_WAIT_TIMEOUT:5s}
