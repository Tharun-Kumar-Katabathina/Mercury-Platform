spring.application.name=order-service
server.port=${SERVER_PORT:8083}

spring.datasource.url=${ORDER_DB_URL:jdbc:postgresql://localhost:5432/mercury_order}
spring.datasource.username=${POSTGRES_USER:mercury}
spring.datasource.password=${POSTGRES_PASSWORD:change-me}

# schema is owned by Flyway; Hibernate only verifies it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# downstream services (never their databases)
product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8081}
inventory.service.url=${INVENTORY_SERVICE_URL:http://localhost:8082}

# Timeouts for every call to Product and Inventory. Without them a hung downstream would hang the
# order request (and hold its idempotency key) indefinitely. No retries: see docs/order-service.md.
spring.http.clients.connect-timeout=${HTTP_CLIENT_CONNECT_TIMEOUT:2s}
spring.http.clients.read-timeout=${HTTP_CLIENT_READ_TIMEOUT:5s}

# how long a duplicate request waits for the first request with the same Idempotency-Key to finish
order.idempotency.wait-timeout=${ORDER_IDEMPOTENCY_WAIT_TIMEOUT:5s}

# ---- saga recovery (every value can be overridden per environment) ----------------------------
order.recovery.enabled=${ORDER_RECOVERY_ENABLED:true}
order.recovery.interval=${ORDER_RECOVERY_INTERVAL:10s}
order.recovery.batch-size=${ORDER_RECOVERY_BATCH_SIZE:20}
order.recovery.max-attempts=${ORDER_RECOVERY_MAX_ATTEMPTS:10}
order.recovery.initial-backoff=${ORDER_RECOVERY_INITIAL_BACKOFF:1s}
order.recovery.max-backoff=${ORDER_RECOVERY_MAX_BACKOFF:5m}
order.recovery.backoff-multiplier=${ORDER_RECOVERY_BACKOFF_MULTIPLIER:2.0}
order.recovery.lease=${ORDER_RECOVERY_LEASE:60s}
order.recovery.stale-after=${ORDER_RECOVERY_STALE_AFTER:60s}

# ---- circuit breaker + bulkhead per downstream service -----------------------------------------
order.resilience.inventory.failure-rate-threshold=${ORDER_INVENTORY_CB_FAILURE_RATE:50}
order.resilience.inventory.sliding-window-size=${ORDER_INVENTORY_CB_WINDOW:20}
order.resilience.inventory.minimum-calls=${ORDER_INVENTORY_CB_MIN_CALLS:10}
order.resilience.inventory.wait-duration-in-open-state=${ORDER_INVENTORY_CB_OPEN_FOR:10s}
order.resilience.inventory.permitted-calls-in-half-open-state=${ORDER_INVENTORY_CB_HALF_OPEN_CALLS:3}
order.resilience.inventory.max-concurrent-calls=${ORDER_INVENTORY_MAX_CONCURRENT:25}
order.resilience.inventory.max-wait=${ORDER_INVENTORY_MAX_WAIT:0ms}
order.resilience.product.failure-rate-threshold=${ORDER_PRODUCT_CB_FAILURE_RATE:50}
order.resilience.product.sliding-window-size=${ORDER_PRODUCT_CB_WINDOW:20}
order.resilience.product.minimum-calls=${ORDER_PRODUCT_CB_MIN_CALLS:10}
order.resilience.product.wait-duration-in-open-state=${ORDER_PRODUCT_CB_OPEN_FOR:10s}
order.resilience.product.permitted-calls-in-half-open-state=${ORDER_PRODUCT_CB_HALF_OPEN_CALLS:3}
order.resilience.product.max-concurrent-calls=${ORDER_PRODUCT_MAX_CONCURRENT:25}
order.resilience.product.max-wait=${ORDER_PRODUCT_MAX_WAIT:0ms}

# ---- actuator: health, metrics and the read-only saga overview ---------------------------------
# /actuator/sagas shows stuck orders (ids and states only, never idempotency keys). There is no
# authentication in this system yet, so do not expose it on a public interface.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,metrics,sagas,outbox}

# ---- Kafka producer and the outbox publisher -------------------------------------------------
# The service starts and serves requests with Kafka down: events simply wait in the outbox.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# bounded waits, so a dead broker costs seconds, never a hung thread
spring.kafka.producer.properties.max.block.ms=${KAFKA_PRODUCER_MAX_BLOCK_MS:5000}
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:5000}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:10000}

order.outbox.enabled=${ORDER_OUTBOX_ENABLED:true}
order.outbox.inventory-commands-topic=${INVENTORY_COMMAND_TOPIC:mercury.inventory.commands}
order.outbox.topic=${ORDER_OUTBOX_TOPIC:mercury.order.events}
order.outbox.interval=${ORDER_OUTBOX_INTERVAL:1s}
order.outbox.batch-size=${ORDER_OUTBOX_BATCH_SIZE:50}
order.outbox.lease=${ORDER_OUTBOX_LEASE:30s}
order.outbox.initial-backoff=${ORDER_OUTBOX_INITIAL_BACKOFF:1s}
order.outbox.max-backoff=${ORDER_OUTBOX_MAX_BACKOFF:1m}
order.outbox.backoff-multiplier=${ORDER_OUTBOX_BACKOFF_MULTIPLIER:2.0}
order.outbox.send-timeout=${ORDER_OUTBOX_SEND_TIMEOUT:10s}

# ---- asynchronous inventory reservation (Phase 10) ---------------------------------------------
# SYNC (default): reserve stock with REST calls during the request (unchanged).
# ASYNC: answer 202, ask Inventory over Kafka, finish the order when its reply arrives.
# Applies to NEW orders only; every order keeps the mode it was created with.
order.reservation.mode=${ORDER_RESERVATION_MODE:SYNC}
# how long an ASYNC order waits for the reply before recovery asks Inventory directly
order.reservation.async-deadline=${ORDER_RESERVATION_ASYNC_DEADLINE:60s}

# consuming Inventory's replies (also when the mode is SYNC, so replies for ASYNC orders created earlier are handled)
order.inbound.enabled=${ORDER_INBOUND_ENABLED:true}
order.inbound.topic=${INVENTORY_EVENT_TOPIC:mercury.inventory.events}
order.inbound.dlq-topic=${INVENTORY_EVENT_DLQ_TOPIC:mercury.inventory.events.dlq}
order.inbound.topic-partitions=${INVENTORY_TOPIC_PARTITIONS:3}
order.inbound.retry.max-attempts=${ORDER_INBOUND_RETRY_MAX_ATTEMPTS:4}
order.inbound.retry.initial-interval=${ORDER_INBOUND_RETRY_INITIAL_INTERVAL:500ms}
order.inbound.retry.multiplier=${ORDER_INBOUND_RETRY_MULTIPLIER:2.0}
order.inbound.retry.max-interval=${ORDER_INBOUND_RETRY_MAX_INTERVAL:5s}
spring.kafka.consumer.group-id=${ORDER_CONSUMER_GROUP:order-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# the offset is committed only after the event was processed
spring.kafka.listener.ack-mode=record
