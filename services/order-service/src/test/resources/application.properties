spring.datasource.url=jdbc:h2:mem:order;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate

product.service.url=http://localhost:8081
inventory.service.url=http://localhost:8082

# mirror main: this file replaces the main application.properties during tests
spring.jpa.open-in-view=false

# the background worker stays off by default in tests; recovery is driven explicitly where tested
order.recovery.enabled=false

# no broker in unit tests; events stay in the outbox (the publisher is tested separately)
order.outbox.enabled=false

# unit tests have no broker: no listener, no topic creation. The Kafka and real-stack tests override these.
order.inbound.enabled=false
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
order.inbound.topic=mercury.inventory.events
order.inbound.dlq-topic=mercury.inventory.events.dlq
order.inbound.retry.max-attempts=3
order.inbound.retry.initial-interval=100ms
order.inbound.retry.multiplier=2.0
order.inbound.retry.max-interval=500ms
order.outbox.inventory-commands-topic=mercury.inventory.commands
order.reservation.mode=SYNC
order.reservation.async-deadline=60s
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# tracing spans are created (so log correlation works) but nothing is exported in tests
management.tracing.export.enabled=false
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false

# the business-logic tests run without authentication; SecurityApiTests switch it on
mercury.security.enabled=false
