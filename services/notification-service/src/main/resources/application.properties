spring.application.name=notification-service
server.port=${SERVER_PORT:8084}

spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/mercury_notification}
spring.datasource.username=${POSTGRES_USER:mercury}
spring.datasource.password=${POSTGRES_PASSWORD:change-me}

# schema is owned by Flyway; Hibernate only verifies it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- Kafka consumer ----------------------------------------------------------------------------
# The service starts and serves its API with Kafka down; it simply consumes once the broker is back.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${NOTIFICATION_CONSUMER_GROUP:notification-service}
# a consumer that starts after events were published must still receive them
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# the offset is committed only after the record was processed
spring.kafka.listener.ack-mode=record
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

notification.topic=${NOTIFICATION_TOPIC:mercury.order.events}
notification.dlq-topic=${NOTIFICATION_DLQ_TOPIC:mercury.order.events.dlq}
# bounded in-consumer retries with backoff, then the record goes to the dead-letter topic
notification.retry.max-attempts=${NOTIFICATION_RETRY_MAX_ATTEMPTS:4}
notification.retry.initial-interval=${NOTIFICATION_RETRY_INITIAL_INTERVAL:500ms}
notification.retry.multiplier=${NOTIFICATION_RETRY_MULTIPLIER:2.0}
notification.retry.max-interval=${NOTIFICATION_RETRY_MAX_INTERVAL:5s}
notification.topic-partitions=${NOTIFICATION_TOPIC_PARTITIONS:3}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,metrics}

# ---- container / Kubernetes runtime (Phase 11) ------------------------------------------------
# On SIGTERM: stop taking new requests, let in-flight ones finish (bounded), then close pools and consumers.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:25s}
# /actuator/health/liveness (is the process alive) and /actuator/health/readiness (should it get traffic).
# Readiness depends on the database only: a Kafka outage must not take a service out of rotation,
# because the outbox and the REST API keep working without it.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
