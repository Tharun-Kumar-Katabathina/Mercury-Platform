spring.datasource.url=jdbc:h2:mem:notification;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
# mirror main: this file replaces the main application.properties during tests
spring.jpa.open-in-view=false

# unit tests have no broker; the Kafka tests start their own and override these
spring.kafka.listener.auto-startup=false
notification.topic=mercury.order.events
notification.dlq-topic=mercury.order.events.dlq
notification.retry.max-attempts=3
notification.retry.initial-interval=100ms
notification.retry.multiplier=2.0
notification.retry.max-interval=500ms
notification.topic-partitions=3
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
management.endpoints.web.exposure.include=health,metrics

# no broker in the unit tests: do not make every context wait for topic creation
spring.kafka.admin.auto-create=false

# tracing spans are created (so log correlation works) but nothing is exported in tests
management.tracing.export.enabled=false
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false

# the business-logic tests run without authentication; SecurityApiTests switch it on
mercury.security.enabled=false
