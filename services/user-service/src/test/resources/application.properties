spring.datasource.url=jdbc:h2:mem:user;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# tests sign with a throw-away key pair
mercury.security.jwt.require-keys=false
mercury.security.max-failed-logins=3
mercury.security.lock-duration=15m
mercury.security.login-attempts-per-minute=1000
mercury.security.admin-email=root@mercury.test
mercury.security.admin-password=correct-horse-battery
mercury.security.service-clients=order-service:service-secret-1,product-service:service-secret-2

management.tracing.export.enabled=false
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
