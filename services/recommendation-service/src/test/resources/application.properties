spring.datasource.url=jdbc:h2:mem:recommendation;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# unit tests: no broker, no Redis, no Qdrant unless a test starts one
recommendation.kafka.enabled=false
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
spring.kafka.consumer.group-id=recommendation-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
recommendation.cache.enabled=false
management.health.redis.enabled=false
management.endpoints.web.exposure.include=health,metrics,prometheus
mercury.security.enabled=false

management.tracing.export.enabled=false
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
recommendation.qdrant.sync-interval=1h

recommendation.kafka.topic=mercury.order.events
recommendation.kafka.dlq-topic=mercury.order.events.recommendation.dlq
recommendation.qdrant.url=http://localhost:6333
recommendation.qdrant.collection=products

# same short Redis timeouts as production, so a Redis outage costs milliseconds, not the 60 s default
spring.data.redis.timeout=300ms
spring.data.redis.connect-timeout=300ms
