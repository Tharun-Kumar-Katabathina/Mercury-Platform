spring.application.name=recommendation-service
server.port=${SERVER_PORT:8086}

spring.datasource.url=${RECOMMENDATION_DB_URL:jdbc:postgresql://localhost:5432/mercury_recommendation}
spring.datasource.username=${POSTGRES_USER:mercury}
# no default: the service refuses to start without a database password
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- Kafka: the order events it learns from ----------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${RECOMMENDATION_CONSUMER_GROUP:recommendation-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
recommendation.kafka.enabled=${RECOMMENDATION_KAFKA_ENABLED:true}
recommendation.kafka.topic=${ORDER_EVENTS_TOPIC:mercury.order.events}
recommendation.kafka.dlq-topic=${RECOMMENDATION_DLQ_TOPIC:mercury.order.events.recommendation.dlq}
recommendation.kafka.retry.max-attempts=${RECOMMENDATION_RETRY_MAX_ATTEMPTS:4}
recommendation.kafka.retry.initial-interval=${RECOMMENDATION_RETRY_INITIAL_INTERVAL:500ms}
recommendation.kafka.retry.max-interval=${RECOMMENDATION_RETRY_MAX_INTERVAL:5s}

# ---- vector index (Qdrant) and cache (Redis) ----------------------------------------------------------------------
recommendation.qdrant.url=${QDRANT_URL:http://localhost:6333}
recommendation.qdrant.collection=${QDRANT_COLLECTION:products}
recommendation.qdrant.dimensions=${EMBEDDING_DIMENSIONS:64}
recommendation.qdrant.sync-interval=${INDEX_SYNC_INTERVAL:5s}
recommendation.cache.enabled=${RECOMMENDATION_CACHE_ENABLED:true}
recommendation.cache.similar-ttl=${SIMILAR_TTL:5m}
recommendation.cache.user-ttl=${USER_RECS_TTL:60s}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:200ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:200ms}
management.health.redis.enabled=false
management.health.kafka.enabled=false

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,metrics,prometheus}
# ---- container / Kubernetes runtime (Phase 11) ------------------------------------------------
# On SIGTERM: stop taking new requests, let in-flight ones finish (bounded), then close pools and consumers.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:25s}
# /actuator/health/liveness (is the process alive) and /actuator/health/readiness (should it get traffic).
# Readiness depends on the database only: a Kafka outage must not take a service out of rotation,
# because the outbox and the REST API keep working without it.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
# ---- observability (Phase 12) -----------------------------------------------------------------
# Metrics: scraped by Prometheus at /actuator/prometheus. Every series carries the application name.
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s
# Traces: always created (their ids appear in every log line); exported over OTLP only when enabled and
# pointed at a collector. REST calls and Kafka messages carry the W3C traceparent header between services.
management.tracing.export.enabled=${TRACING_EXPORT_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
# metrics are pulled by Prometheus and logs go to stdout: no OTLP export for either
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# ---- capacity knobs ----------------------------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:8192}

# ---- security ----------------------------------------------------------------------------------------------------
mercury.security.enabled=${SECURITY_ENABLED:true}
mercury.security.jwt.public-key-file=${JWT_PUBLIC_KEY_FILE:}
mercury.security.jwt.issuer=${JWT_ISSUER:mercury-user-service}
mercury.security.jwt.audience=${JWT_AUDIENCE:mercury}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.max-http-request-header-size=16KB
