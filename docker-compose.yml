# Mercury platform, production-like.
#
#   scripts/init-secrets.sh         # once: random .env and the JWT key pair (both git-ignored)
#   docker compose -f docker-compose.yml --profile platform up -d --build
#
# Infrastructure (postgres, kafka, qdrant) has no profile and always starts; the four services are in the
# "platform" profile, so `docker compose up -d postgres kafka` still gives the local-development infrastructure.
#
# docker-compose.override.yml (picked up automatically unless you pass -f) only adds developer
# conveniences: host ports for Postgres/Kafka/Qdrant and a default dev password. Production-like runs
# use `-f docker-compose.yml`, where the data tier is reachable only from inside the `data` network.

name: mercury-platform

x-service: &service
  restart: unless-stopped
  read_only: true                      # the root filesystem is immutable ...
  tmpfs:
    - /tmp:size=64m,mode=1777          # ... except a small scratch area (Tomcat work dir)
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 40s               # > the 25s graceful-shutdown phase configured in the services
  init: false                          # java is PID 1 and handles SIGTERM itself
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  networks: [data, edge]

x-java-env: &java-env
  POSTGRES_USER: ${POSTGRES_USER:-mercury}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  SHUTDOWN_TIMEOUT: 25s
  # authentication: every service verifies tokens with the user-service's PUBLIC key. SECURITY_ENABLED=false exists
  # only for local experiments and for the load tests; it is never the default.
  SECURITY_ENABLED: ${SECURITY_ENABLED:-true}
  JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public
  USER_SERVICE_URL: http://user-service:8085

services:
  # ---- infrastructure ----------------------------------------------------------------------------
  postgres:
    image: postgres:17
    restart: unless-stopped
    read_only: true                      # writes only to the data volume and the socket directory below (same as the Kubernetes pod)
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999,mode=3777
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mercury}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: mercury
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d mercury"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384M }
    shm_size: 128m
    networks: [data]

  kafka:
    # Single-node Kafka in KRaft mode (no ZooKeeper). Inside the network: kafka:29092.
    image: apache/kafka:3.9.0
    restart: unless-stopped
    read_only: true                      # writes only to the data volume, the broker config rendered at start-up, and /tmp
    tmpfs:
      - /opt/kafka/config:uid=1000,gid=1000,mode=0755
      - /tmp:uid=1000,gid=1000,mode=0755,size=256m
    environment:
      LOG_DIR: /tmp/kafka-logs           # kafka-run-class.sh would create /opt/kafka/logs on the read-only image
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 640M }
    networks: [data]

  qdrant:
    # Vector database for the recommendation service (Phase 16).
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    read_only: true                      # collections on the volume; snapshots, the init marker and /tmp are scratch
    tmpfs:
      - /qdrant/snapshots:mode=1777,size=256m
      - /tmp:mode=1777,size=16m
    environment:
      QDRANT_INIT_FILE_PATH: /tmp/.qdrant-initialized
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384M }
    networks: [data]

  redis:
    # Cache for hot reads (product lookups). A cache, not a store: nothing here is the only copy of anything,
    # so it is bounded (LRU eviction) and has no persistence.
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    networks: [data]

  # ---- services (profile "platform") ---------------------------------------------------------------
  product-service:
    <<: *service
    profiles: [platform]
    build:
      context: ./services/product-service
      dockerfile: ../../infrastructure/docker/Dockerfile.service
      args: { SERVICE: product-service, PORT: "8081" }
    image: mercury/product-service:${MERCURY_VERSION:-dev}
    environment:
      <<: *java-env
      SERVICE_CLIENT_ID: product-service
      SERVICE_CLIENT_SECRET: ${PRODUCT_SERVICE_SECRET:-}
      PRODUCT_DB_URL: jdbc:postgresql://postgres:5432/mercury_product
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      REDIS_HOST: redis
      PRODUCT_CACHE_ENABLED: ${PRODUCT_CACHE_ENABLED:-false}
    secrets: [jwt_public]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:8081:8081"]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 448M }

  inventory-service:
    <<: *service
    profiles: [platform]
    build:
      context: ./services/inventory-service
      dockerfile: ../../infrastructure/docker/Dockerfile.service
      args: { SERVICE: inventory-service, PORT: "8082" }
    image: mercury/inventory-service:${MERCURY_VERSION:-dev}
    environment:
      <<: *java-env
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/mercury_inventory
    secrets: [jwt_public]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports: ["127.0.0.1:8082:8082"]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 512M }

  order-service:
    <<: *service
    profiles: [platform]
    build:
      context: ./services/order-service
      dockerfile: ../../infrastructure/docker/Dockerfile.service
      args: { SERVICE: order-service, PORT: "8083" }
    image: mercury/order-service:${MERCURY_VERSION:-dev}
    environment:
      <<: *java-env
      SERVICE_CLIENT_ID: order-service
      SERVICE_CLIENT_SECRET: ${ORDER_SERVICE_SECRET:-}
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/mercury_order
      PRODUCT_SERVICE_URL: http://product-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      ORDER_RESERVATION_MODE: ${ORDER_RESERVATION_MODE:-SYNC}
      # the circuit breakers look at the last 20 SECONDS, not the last 20 calls, so an outage ages out by itself
      ORDER_PRODUCT_CB_WINDOW_TYPE: TIME_BASED
      ORDER_PRODUCT_CB_WINDOW: "20"
      ORDER_INVENTORY_CB_WINDOW_TYPE: TIME_BASED
      ORDER_INVENTORY_CB_WINDOW: "20"
    secrets: [jwt_public]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      product-service: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
    ports: ["127.0.0.1:8083:8083"]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 512M }

  notification-service:
    <<: *service
    profiles: [platform]
    build:
      context: ./services/notification-service
      dockerfile: ../../infrastructure/docker/Dockerfile.service
      args: { SERVICE: notification-service, PORT: "8084" }
    image: mercury/notification-service:${MERCURY_VERSION:-dev}
    environment:
      <<: *java-env
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/mercury_notification
    secrets: [jwt_public]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports: ["127.0.0.1:8084:8084"]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 448M }

  user-service:
    <<: *service
    profiles: [platform]
    build:
      context: ./services/user-service
      dockerfile: ../../infrastructure/docker/Dockerfile.service
      args: { SERVICE: user-service, PORT: "8085" }
    image: mercury/user-service:${MERCURY_VERSION:-dev}
    environment:
      <<: *java-env
      USER_DB_URL: jdbc:postgresql://postgres:5432/mercury_user
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private
      JWT_REQUIRE_KEYS: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SERVICE_CLIENTS: order-service:${ORDER_SERVICE_SECRET:-},product-service:${PRODUCT_SERVICE_SECRET:-}
      JWT_USER_TTL: ${JWT_USER_TTL:-15m}
    secrets: [jwt_private, jwt_public]
    # A file secret keeps the owner, group and mode of the file on the host (compose ignores the uid/gid/mode options for files).
    # The private key is mode 640, owned by whoever ran scripts/init-secrets.sh, while this container runs as 10001:10001, so on
    # Linux it could not read it. It is given the key's own group (recorded in .env by scripts/init-secrets.sh): read access for
    # that group, none for anyone else, and no root. Without the variable the default is the container's own group, which adds nothing.
    group_add: ["${JWT_PRIVATE_KEY_GID:-10001}"]
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:8085:8085"]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 448M }

  recommendation-service:
    <<: *service
    profiles: [platform]
    build:
      context: ./services/recommendation-service
      dockerfile: ../../infrastructure/docker/Dockerfile.service
      args: { SERVICE: recommendation-service, PORT: "8086" }
    image: mercury/recommendation-service:${MERCURY_VERSION:-dev}
    environment:
      <<: *java-env
      RECOMMENDATION_DB_URL: jdbc:postgresql://postgres:5432/mercury_recommendation
      QDRANT_URL: http://qdrant:6333
      REDIS_HOST: redis
    secrets: [jwt_public]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:8086:8086"]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 448M }

  api-gateway:
    <<: *service
    profiles: [platform]
    build:
      context: ./services/api-gateway
      dockerfile: ../../infrastructure/docker/Dockerfile.service
      args: { SERVICE: api-gateway, PORT: "8090" }
    image: mercury/api-gateway:${MERCURY_VERSION:-dev}
    environment:
      SECURITY_ENABLED: ${SECURITY_ENABLED:-true}
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public
      SHUTDOWN_TIMEOUT: 25s
      USER_SERVICE_URL: http://user-service:8085
      PRODUCT_SERVICE_URL: http://product-service:8081
      ORDER_SERVICE_URL: http://order-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8086
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # the defaults are the gateway's own; a load test that sends every shopper's traffic with one token raises the per-user pair
      RATE_LIMIT_IP_PER_SECOND: ${RATE_LIMIT_IP_PER_SECOND:-100}
      RATE_LIMIT_IP_BURST: ${RATE_LIMIT_IP_BURST:-200}
      RATE_LIMIT_USER_PER_SECOND: ${RATE_LIMIT_USER_PER_SECOND:-30}
      RATE_LIMIT_USER_BURST: ${RATE_LIMIT_USER_BURST:-60}
    secrets: [jwt_public]
    depends_on:
      user-service: { condition: service_healthy }
      product-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
    ports: ["127.0.0.1:8090:8090"]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 384M }

networks:
  # The data tier (Postgres, Kafka, Qdrant) lives here only. `internal` means no route to the outside world
  # and no published ports: only containers attached to this network can reach it.
  data:
    internal: true
  # What the services use to be reachable from the host (127.0.0.1 only) and to call out.
  edge: {}

secrets:
  # created by scripts/init-secrets.sh (git-ignored). The private key is mounted only into the user-service.
  jwt_private:
    file: ./.secrets/jwt-private.pem
  jwt_public:
    file: ./.secrets/jwt-public.pem

volumes:
  postgres_data:
  kafka_data:
  qdrant_data:
