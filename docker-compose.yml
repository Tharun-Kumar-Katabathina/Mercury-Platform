
services:
  postgres:
    image: postgres:17
    container_name: mercury-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mercury
      POSTGRES_PASSWORD: mercury
      POSTGRES_DB: mercury
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercury -d mercury"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
